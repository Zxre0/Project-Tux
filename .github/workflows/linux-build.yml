name: Linux build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libtomlplusplus-dev libvulkan-dev zlib1g-dev clang-format
      - name: Formatting
        run: find src cli include tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Build and asset-free tests
        run: ./build.sh
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: dnf -y install gcc-c++ cmake ninja-build qt6-qtbase-devel tomlplusplus-devel zlib-ng-compat-devel vulkan-headers vulkan-loader-devel clang lld nodejs wine-devel file
      - name: Build and asset-free tests
        run: ./build.sh
      - name: Windows helpers
        run: bash helpers/windows/build.sh
